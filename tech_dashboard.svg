<svg fill="none" viewBox="0 0 1000 905" width="100%" height="905" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Liquid Glow Backlights -->
    <linearGradient id="glow-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="glow-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="glow-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gaussian Blur -->
    <filter id="liquid-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <!-- Glass Panel Borders -->
    <linearGradient id="tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .tile-title { font-weight: 800; font-size: 21px; fill: #ffffff; letter-spacing: 0.5px; }
    .skill-text { font-weight: 700; font-size: 15.5px; fill: #F1F5F9; }
    .panel-base { fill: rgba(255, 255, 255, 0.025); stroke: url(#tile-border); stroke-width: 2px; }
    .skill-pill { fill: rgba(255, 255, 255, 0.06); stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.2px; }
    .dot-cyan { fill: #06B6D4; filter: drop-shadow(0 0 6px #06B6D4); }
    .dot-violet { fill: #8B5CF6; filter: drop-shadow(0 0 6px #8B5CF6); }
    .dot-emerald { fill: #10B981; filter: drop-shadow(0 0 6px #10B981); }
    .dot-amber { fill: #F59E0B; filter: drop-shadow(0 0 6px #F59E0B); }
  </style>

  <!-- Base Grid Background -->
  <rect width="1000" height="905" rx="24" fill="url(#bg-grad)" />

  <!-- Liquid Glow Backlights (Behind Glass Dashboard) -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-violet)" filter="url(#liquid-blur)" opacity="0.45" />
  <circle cx="800" cy="350" r="220" fill="url(#glow-cyan)" filter="url(#liquid-blur)" opacity="0.45" />
  <circle cx="350" cy="550" r="180" fill="url(#glow-emerald)" filter="url(#liquid-blur)" opacity="0.35" />
  <circle cx="250" cy="750" r="190" fill="url(#glow-amber)" filter="url(#liquid-blur)" opacity="0.35" />
  <circle cx="750" cy="800" r="180" fill="url(#glow-violet)" filter="url(#liquid-blur)" opacity="0.4" />

  <!-- Overall Dashboard Outliner Frame -->
  <rect x="20" y="20" width="960" height="865" rx="20" fill="rgba(255, 255, 255, 0.01)" stroke="url(#tile-border)" stroke-width="1.8" />

  <!-- COLUMN 1: LEFT -->

  <!-- TILE 1: Programming Languages -->
  <g transform="translate(40, 40)">
    <rect class="panel-base" width="445" height="210" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-violet" />
    <text class="font-inter tile-title" x="46" y="40">Programming Languages</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- TypeScript -->
      <rect class="skill-pill" x="0" y="0" width="135" height="44" rx="10" />
      <text class="font-inter skill-text" x="67.5" y="27" text-anchor="middle">TypeScript</text>
      <!-- Python -->
      <rect class="skill-pill" x="147" y="0" width="105" height="44" rx="10" />
      <text class="font-inter skill-text" x="199.5" y="27" text-anchor="middle">Python</text>
      <!-- Java -->
      <rect class="skill-pill" x="264" y="0" width="90" height="44" rx="10" />
      <text class="font-inter skill-text" x="309" y="27" text-anchor="middle">Java</text>
      
      <!-- Row 2 -->
      <!-- C# -->
      <rect class="skill-pill" x="0" y="56" width="75" height="44" rx="10" />
      <text class="font-inter skill-text" x="37.5" y="83" text-anchor="middle">C#</text>
      <!-- C++ -->
      <rect class="skill-pill" x="87" y="56" width="80" height="44" rx="10" />
      <text class="font-inter skill-text" x="127" y="83" text-anchor="middle">C++</text>
    </g>
  </g>

  <!-- TILE 2: Backend -->
  <g transform="translate(40, 275)">
    <rect class="panel-base" width="445" height="155" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-emerald" />
    <text class="font-inter tile-title" x="46" y="40">Backend</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- Node.js -->
      <rect class="skill-pill" x="0" y="0" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="55" y="27" text-anchor="middle">Node.js</text>
      <!-- FastAPI -->
      <rect class="skill-pill" x="122" y="0" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="177" y="27" text-anchor="middle">FastAPI</text>
      <!-- Spring Boot -->
      <rect class="skill-pill" x="244" y="0" width="140" height="44" rx="10" />
      <text class="font-inter skill-text" x="314" y="27" text-anchor="middle">Spring Boot</text>
    </g>
  </g>

  <!-- TILE 3: Database -->
  <g transform="translate(40, 455)">
    <rect class="panel-base" width="445" height="155" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-amber" />
    <text class="font-inter tile-title" x="46" y="40">Database</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- PostgreSQL -->
      <rect class="skill-pill" x="0" y="0" width="135" height="44" rx="10" />
      <text class="font-inter skill-text" x="67.5" y="27" text-anchor="middle">PostgreSQL</text>
      <!-- MySQL -->
      <rect class="skill-pill" x="147" y="0" width="100" height="44" rx="10" />
      <text class="font-inter skill-text" x="197" y="27" text-anchor="middle">MySQL</text>
      <!-- SQLite -->
      <rect class="skill-pill" x="259" y="0" width="105" height="44" rx="10" />
      <text class="font-inter skill-text" x="311.5" y="27" text-anchor="middle">SQLite</text>
    </g>
  </g>

  <!-- TILE 4: AI & Machine Learning -->
  <g transform="translate(40, 635)">
    <rect class="panel-base" width="445" height="210" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-cyan" />
    <text class="font-inter tile-title" x="46" y="40">AI &amp; Machine Learning</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- PyTorch -->
      <rect class="skill-pill" x="0" y="0" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="55" y="27" text-anchor="middle">PyTorch</text>
      <!-- LLM -->
      <rect class="skill-pill" x="122" y="0" width="80" height="44" rx="10" />
      <text class="font-inter skill-text" x="162" y="27" text-anchor="middle">LLM</text>
      <!-- Computer Vision -->
      <rect class="skill-pill" x="214" y="0" width="165" height="44" rx="10" />
      <text class="font-inter skill-text" x="296.5" y="27" text-anchor="middle">Computer Vision</text>
      
      <!-- Row 2 -->
      <!-- Python -->
      <rect class="skill-pill" x="0" y="56" width="105" height="44" rx="10" />
      <text class="font-inter skill-text" x="52.5" y="83" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- COLUMN 2: RIGHT -->

  <!-- TILE 5: Frontend -->
  <g transform="translate(515, 40)">
    <rect class="panel-base" width="445" height="285" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-cyan" />
    <text class="font-inter tile-title" x="46" y="40">Frontend</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- React -->
      <rect class="skill-pill" x="0" y="0" width="100" height="44" rx="10" />
      <text class="font-inter skill-text" x="50" y="27" text-anchor="middle">React</text>
      <!-- Next.js -->
      <rect class="skill-pill" x="112" y="0" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="167" y="27" text-anchor="middle">Next.js</text>
      <!-- Flutter -->
      <rect class="skill-pill" x="234" y="0" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="289" y="27" text-anchor="middle">Flutter</text>
      
      <!-- Row 2 -->
      <!-- Android -->
      <rect class="skill-pill" x="0" y="56" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="55" y="83" text-anchor="middle">Android</text>
      <!-- Zustand -->
      <rect class="skill-pill" x="122" y="56" width="110" height="44" rx="10" />
      <text class="font-inter skill-text" x="177" y="83" text-anchor="middle">Zustand</text>
      <!-- Vitest -->
      <rect class="skill-pill" x="244" y="56" width="105" height="44" rx="10" />
      <text class="font-inter skill-text" x="296.5" y="83" text-anchor="middle">Vitest</text>
      
      <!-- Row 3 -->
      <!-- Tailwind CSS -->
      <rect class="skill-pill" x="0" y="112" width="150" height="44" rx="10" />
      <text class="font-inter skill-text" x="75" y="139" text-anchor="middle">Tailwind CSS</text>
      <!-- Playwright -->
      <rect class="skill-pill" x="162" y="112" width="135" height="44" rx="10" />
      <text class="font-inter skill-text" x="229.5" y="139" text-anchor="middle">Playwright</text>
    </g>
  </g>

  <!-- TILE 6: Infrastructure & Cloud -->
  <g transform="translate(515, 350)">
    <rect class="panel-base" width="445" height="230" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-violet" />
    <text class="font-inter tile-title" x="46" y="40">Infrastructure &amp; Cloud</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- AWS -->
      <rect class="skill-pill" x="0" y="0" width="100" height="44" rx="10" />
      <text class="font-inter skill-text" x="50" y="27" text-anchor="middle">AWS</text>
      <!-- Docker -->
      <rect class="skill-pill" x="112" y="0" width="120" height="44" rx="10" />
      <text class="font-inter skill-text" x="172" y="27" text-anchor="middle">Docker</text>
      
      <!-- Row 2 -->
      <!-- Git -->
      <rect class="skill-pill" x="0" y="56" width="90" height="44" rx="10" />
      <text class="font-inter skill-text" x="45" y="83" text-anchor="middle">Git</text>
      <!-- Linux -->
      <rect class="skill-pill" x="102" y="56" width="100" height="44" rx="10" />
      <text class="font-inter skill-text" x="152" y="83" text-anchor="middle">Linux</text>
    </g>
  </g>

  <!-- TILE 7: Game Development -->
  <g transform="translate(515, 605)">
    <rect class="panel-base" width="445" height="240" rx="18" />
    <circle cx="25" cy="34" r="7" class="dot-emerald" />
    <text class="font-inter tile-title" x="46" y="40">Game Development</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 78)">
      <!-- Unity -->
      <rect class="skill-pill" x="0" y="0" width="100" height="44" rx="10" />
      <text class="font-inter skill-text" x="50" y="27" text-anchor="middle">Unity</text>
      <!-- C# -->
      <rect class="skill-pill" x="112" y="0" width="75" height="44" rx="10" />
      <text class="font-inter skill-text" x="149.5" y="27" text-anchor="middle">C#</text>
      
      <!-- Row 2 -->
      <!-- C++ -->
      <rect class="skill-pill" x="0" y="56" width="80" height="44" rx="10" />
      <text class="font-inter skill-text" x="40" y="83" text-anchor="middle">C++</text>
    </g>
  </g>
</svg>
