<svg fill="none" viewBox="0 0 1000 905" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Liquid Glow Backlights -->
    <linearGradient id="glow-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="glow-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="glow-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gaussian Blur -->
    <filter id="liquid-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <!-- Glass Panel Borders -->
    <linearGradient id="tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .tile-title { font-weight: 800; font-size: 24px; fill: #ffffff; letter-spacing: 0.5px; }
    .skill-text { font-weight: 700; font-size: 18px; fill: #F1F5F9; letter-spacing: 0.2px; }
    .panel-base { fill: rgba(255, 255, 255, 0.025); stroke: url(#tile-border); stroke-width: 2px; }
    .skill-pill { fill: rgba(255, 255, 255, 0.06); stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.2px; }
    .dot-cyan { fill: #06B6D4; filter: drop-shadow(0 0 6px #06B6D4); }
    .dot-violet { fill: #8B5CF6; filter: drop-shadow(0 0 6px #8B5CF6); }
    .dot-emerald { fill: #10B981; filter: drop-shadow(0 0 6px #10B981); }
    .dot-amber { fill: #F59E0B; filter: drop-shadow(0 0 6px #F59E0B); }
  </style>

  <!-- Base Grid Background -->
  <rect width="1000" height="905" rx="24" fill="url(#bg-grad)" />

  <!-- Liquid Glow Backlights (Behind Glass Dashboard) -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-violet)" filter="url(#liquid-blur)" opacity="0.45" />
  <circle cx="800" cy="350" r="220" fill="url(#glow-cyan)" filter="url(#liquid-blur)" opacity="0.45" />
  <circle cx="350" cy="550" r="180" fill="url(#glow-emerald)" filter="url(#liquid-blur)" opacity="0.35" />
  <circle cx="250" cy="750" r="190" fill="url(#glow-amber)" filter="url(#liquid-blur)" opacity="0.35" />
  <circle cx="750" cy="800" r="180" fill="url(#glow-violet)" filter="url(#liquid-blur)" opacity="0.4" />

  <!-- Overall Dashboard Outliner Frame -->
  <rect x="20" y="20" width="960" height="865" rx="20" fill="rgba(255, 255, 255, 0.01)" stroke="url(#tile-border)" stroke-width="1.8" />

  <!-- COLUMN 1: LEFT -->

  <!-- TILE 1: Programming Languages -->
  <g transform="translate(40, 40)">
    <rect class="panel-base" width="445" height="210" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-violet" />
    <text class="font-inter tile-title" x="50" y="42">Programming Languages</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 74)">
      <!-- Row 1 -->
      <rect class="skill-pill" x="0" y="0" width="155" height="50" rx="12" />
      <text class="font-inter skill-text" x="77.5" y="25" dominant-baseline="middle" text-anchor="middle">TypeScript</text>
      
      <rect class="skill-pill" x="167" y="0" width="116" height="50" rx="12" />
      <text class="font-inter skill-text" x="225" y="25" dominant-baseline="middle" text-anchor="middle">Python</text>
      
      <rect class="skill-pill" x="295" y="0" width="100" height="50" rx="12" />
      <text class="font-inter skill-text" x="345" y="25" dominant-baseline="middle" text-anchor="middle">Java</text>
      
      <!-- Row 2 -->
      <rect class="skill-pill" x="0" y="64" width="191" height="50" rx="12" />
      <text class="font-inter skill-text" x="95.5" y="89" dominant-baseline="middle" text-anchor="middle">C#</text>
      
      <rect class="skill-pill" x="203" y="64" width="192" height="50" rx="12" />
      <text class="font-inter skill-text" x="299" y="89" dominant-baseline="middle" text-anchor="middle">C++</text>
    </g>
  </g>

  <!-- TILE 2: Backend -->
  <g transform="translate(40, 275)">
    <rect class="panel-base" width="445" height="155" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-emerald" />
    <text class="font-inter tile-title" x="50" y="42">Backend</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 74)">
      <rect class="skill-pill" x="0" y="0" width="115" height="50" rx="12" />
      <text class="font-inter skill-text" x="57.5" y="25" dominant-baseline="middle" text-anchor="middle">Node.js</text>
      
      <rect class="skill-pill" x="127" y="0" width="115" height="50" rx="12" />
      <text class="font-inter skill-text" x="184.5" y="25" dominant-baseline="middle" text-anchor="middle">FastAPI</text>
      
      <rect class="skill-pill" x="254" y="0" width="141" height="50" rx="12" />
      <text class="font-inter skill-text" x="324.5" y="25" dominant-baseline="middle" text-anchor="middle">Spring Boot</text>
    </g>
  </g>

  <!-- TILE 3: Database -->
  <g transform="translate(40, 455)">
    <rect class="panel-base" width="445" height="155" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-amber" />
    <text class="font-inter tile-title" x="50" y="42">Database</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 74)">
      <rect class="skill-pill" x="0" y="0" width="151" height="50" rx="12" />
      <text class="font-inter skill-text" x="75.5" y="25" dominant-baseline="middle" text-anchor="middle">PostgreSQL</text>
      
      <rect class="skill-pill" x="163" y="0" width="110" height="50" rx="12" />
      <text class="font-inter skill-text" x="218" y="25" dominant-baseline="middle" text-anchor="middle">MySQL</text>
      
      <rect class="skill-pill" x="285" y="0" width="110" height="50" rx="12" />
      <text class="font-inter skill-text" x="340" y="25" dominant-baseline="middle" text-anchor="middle">SQLite</text>
    </g>
  </g>

  <!-- TILE 4: AI & Machine Learning -->
  <g transform="translate(40, 635)">
    <rect class="panel-base" width="445" height="210" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-cyan" />
    <text class="font-inter tile-title" x="50" y="42">AI &amp; Machine Learning</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 74)">
      <!-- Row 1 -->
      <rect class="skill-pill" x="0" y="0" width="180" height="50" rx="12" />
      <text class="font-inter skill-text" x="90" y="25" dominant-baseline="middle" text-anchor="middle">PyTorch</text>
      
      <rect class="skill-pill" x="192" y="0" width="203" height="50" rx="12" />
      <text class="font-inter skill-text" x="293.5" y="25" dominant-baseline="middle" text-anchor="middle">Computer Vision</text>
      
      <!-- Row 2 -->
      <rect class="skill-pill" x="0" y="64" width="180" height="50" rx="12" />
      <text class="font-inter skill-text" x="90" y="89" dominant-baseline="middle" text-anchor="middle">LLM</text>
      
      <rect class="skill-pill" x="192" y="64" width="203" height="50" rx="12" />
      <text class="font-inter skill-text" x="293.5" y="89" dominant-baseline="middle" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- COLUMN 2: RIGHT -->

  <!-- TILE 5: Frontend -->
  <g transform="translate(515, 40)">
    <rect class="panel-base" width="445" height="285" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-cyan" />
    <text class="font-inter tile-title" x="50" y="42">Frontend</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 74)">
      <!-- Row 1 -->
      <rect class="skill-pill" x="0" y="0" width="120" height="50" rx="12" />
      <text class="font-inter skill-text" x="60" y="25" dominant-baseline="middle" text-anchor="middle">React</text>
      
      <rect class="skill-pill" x="132" y="0" width="125" height="50" rx="12" />
      <text class="font-inter skill-text" x="194.5" y="25" dominant-baseline="middle" text-anchor="middle">Next.js</text>
      
      <rect class="skill-pill" x="269" y="0" width="126" height="50" rx="12" />
      <text class="font-inter skill-text" x="332" y="25" dominant-baseline="middle" text-anchor="middle">Flutter</text>
      
      <!-- Row 2 -->
      <rect class="skill-pill" x="0" y="64" width="125" height="50" rx="12" />
      <text class="font-inter skill-text" x="62.5" y="89" dominant-baseline="middle" text-anchor="middle">Android</text>
      
      <rect class="skill-pill" x="137" y="64" width="125" height="50" rx="12" />
      <text class="font-inter skill-text" x="199.5" y="89" dominant-baseline="middle" text-anchor="middle">Zustand</text>
      
      <rect class="skill-pill" x="274" y="64" width="121" height="50" rx="12" />
      <text class="font-inter skill-text" x="334.5" y="89" dominant-baseline="middle" text-anchor="middle">Vitest</text>
      
      <!-- Row 3 -->
      <rect class="skill-pill" x="0" y="128" width="195" height="50" rx="12" />
      <text class="font-inter skill-text" x="97.5" y="153" dominant-baseline="middle" text-anchor="middle">Tailwind CSS</text>
      
      <rect class="skill-pill" x="207" y="128" width="188" height="50" rx="12" />
      <text class="font-inter skill-text" x="301" y="153" dominant-baseline="middle" text-anchor="middle">Playwright</text>
    </g>
  </g>

  <!-- TILE 6: Infrastructure & Cloud -->
  <g transform="translate(515, 350)">
    <rect class="panel-base" width="445" height="230" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-violet" />
    <text class="font-inter tile-title" x="50" y="42">Infrastructure &amp; Cloud</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 74)">
      <!-- Row 1 -->
      <rect class="skill-pill" x="0" y="0" width="180" height="50" rx="12" />
      <text class="font-inter skill-text" x="90" y="25" dominant-baseline="middle" text-anchor="middle">AWS</text>
      
      <rect class="skill-pill" x="192" y="0" width="203" height="50" rx="12" />
      <text class="font-inter skill-text" x="293.5" y="25" dominant-baseline="middle" text-anchor="middle">Docker</text>
      
      <!-- Row 2 -->
      <rect class="skill-pill" x="0" y="64" width="180" height="50" rx="12" />
      <text class="font-inter skill-text" x="90" y="89" dominant-baseline="middle" text-anchor="middle">Git</text>
      
      <rect class="skill-pill" x="192" y="64" width="203" height="50" rx="12" />
      <text class="font-inter skill-text" x="293.5" y="89" dominant-baseline="middle" text-anchor="middle">Linux</text>
    </g>
  </g>

  <!-- TILE 7: Game Development -->
  <g transform="translate(515, 605)">
    <rect class="panel-base" width="445" height="240" rx="18" />
    <circle cx="26" cy="34" r="8" class="dot-emerald" />
    <text class="font-inter tile-title" x="50" y="42">Game Development</text>
    <!-- Skills Grid -->
    <g transform="translate(25, 84)">
      <!-- Row 1 -->
      <rect class="skill-pill" x="0" y="0" width="191" height="50" rx="12" />
      <text class="font-inter skill-text" x="95.5" y="25" dominant-baseline="middle" text-anchor="middle">Unity</text>
      
      <rect class="skill-pill" x="203" y="0" width="192" height="50" rx="12" />
      <text class="font-inter skill-text" x="299" y="25" dominant-baseline="middle" text-anchor="middle">C#</text>
      
      <!-- Row 2 (Centered) -->
      <rect class="skill-pill" x="102" y="64" width="191" height="50" rx="12" />
      <text class="font-inter skill-text" x="197.5" y="89" dominant-baseline="middle" text-anchor="middle">C++</text>
    </g>
  </g>
</svg>
